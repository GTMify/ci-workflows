name: gate

# Shared quality gate, called by every GTMify repo except GTMify/GTMify (the app),
# which has its own three workflows built around platformOS constraints that apply
# nowhere else.
#
# WHY THIS LIVES IN A PUBLIC REPO
#
# A private reusable workflow can only be called from within the same organization
# or user account. Four of the active repos live under the personal
# scott-wueschinski-GTMify account rather than the GTMify org, so an org-private
# host would have reached six of ten and left the rest on a vendored copy that
# drifts. A public workflow is callable from any repo, private ones included.
# Nothing secret lives here: workflow YAML and check scripts only.
#
# ENFORCEMENT, AND ITS LIMIT
#
# The GTMify org is on the free plan, where branch protection and rulesets return
# 403 on private repos. These checks therefore RUN and show red on a pull request,
# but cannot be made required. Real enforcement for the junk gate comes from the
# local pre-commit hook in gtmify-config, which blocks junk before it can be
# committed at all, and does not depend on a GitHub plan.

on:
  workflow_call:
    inputs:
      tier:
        description: "a = config repo, b = builds and deploys, c = content only"
        required: true
        type: string
      build_cmd:
        description: "Tier B only. Shell command that must succeed, e.g. 'npm ci && npm run build'"
        required: false
        type: string
        default: ""
      node_version:
        description: "Tier B only. Node version for the build step."
        required: false
        type: string
        default: "24"
      house_style:
        description: >
          Off by default and deliberately so. The linter lives in the PRIVATE
          GTMify/claude-house-style repo, which this public workflow cannot read
          without a token. Turning this on requires passing house_style_token.
          Resolve by either making that linter public or minting a read-only PAT;
          until then house style is enforced by the local write-time hook, which
          already covers the common case.
        required: false
        type: boolean
        default: false
      ci_ref:
        description: "Ref of this repo to load scripts from. Keep in step with the caller's `uses:` tag."
        required: false
        type: string
        default: "v1"
    secrets:
      house_style_token:
        description: "Read access to GTMify/claude-house-style. Only needed when house_style is true."
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: "gate (tier ${{ inputs.tier }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v5
        with:
          # Full history: the junk gate diffs against the pull request base, and a
          # shallow clone has no base commit to diff against.
          fetch-depth: 0

      - name: Check out the shared check scripts
        uses: actions/checkout@v5
        with:
          repository: GTMify/ci-workflows
          ref: ${{ inputs.ci_ref }}
          path: .ci-workflows

      - name: Resolve the comparison base
        id: base
        # On a pull request, compare against its base branch. On a manual dispatch
        # there is no base, so fall back to auditing every tracked file, which makes
        # `workflow_dispatch` the cleanup tool for a repo that already carries junk.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.ref }}"
            git fetch --no-tags --quiet origin "$base"
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "ref=origin/$base" >> "$GITHUB_OUTPUT"
            echo "comparing against origin/$base"
          else
            echo "mode=audit" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "no pull request base; auditing every tracked file"
          fi

      - name: Junk-file gate
        # Runs on every tier. This is the check that pays for itself: nothing
        # stopped 33 worktree gitlinks and a SQLite write-ahead log from becoming
        # tracked in the app repo, which drove local master 19 commits off origin.
        run: |
          set -euo pipefail
          if [ "${{ steps.base.outputs.mode }}" = "audit" ]; then
            bash .ci-workflows/scripts/junk_file_gate.sh --audit
          else
            bash .ci-workflows/scripts/junk_file_gate.sh --base "${{ steps.base.outputs.ref }}"
          fi

      - name: Secret scan
        if: inputs.tier == 'a'
        # GTM-8555. The same scripts/secret_scan_gate.sh the gtmify-config
        # pre-commit hook runs, so CI and the hook apply one rule set. Only the
        # PATTERN layer runs here: CI has no env file, so the value layer reports
        # itself unavailable.
        #
        # A short scan is refused rather than passed. The script exits 0 on
        # "0 of N checked" (on #768 an amend checked 0 paths and passed), so this
        # step counts the non-deletion paths itself and fails when the script
        # neither read nor named a reason for skipping every one of them, or
        # prints no summary line. An image-only or allowlisted-only diff is
        # accounted for and passes, as do deletion-only and empty diffs.
        # tests/gate_secret_scan_wiring.sh runs this block verbatim.
        run: |
          set -euo pipefail
          if [ "${{ steps.base.outputs.mode }}" = "audit" ]; then
            in_scope=$(git ls-files | wc -l | tr -d ' ')
            rc=0
            out=$(bash .ci-workflows/scripts/secret_scan_gate.sh --audit 2>&1) || rc=$?
          else
            in_scope=$(git diff --name-only --diff-filter=ACMRT "${{ steps.base.outputs.ref }}...HEAD" | wc -l | tr -d ' ')
            rc=0
            out=$(bash .ci-workflows/scripts/secret_scan_gate.sh --base "${{ steps.base.outputs.ref }}" 2>&1) || rc=$?
          fi
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          summary=$(printf '%s\n' "$out" | sed -n 's/^>> secret scan passed\. \([0-9][0-9]*\) of \([0-9][0-9]*\) path(s) checked.*/\1 \2/p' | head -n 1)
          if [ -z "$summary" ]; then
            echo "!! secret scan printed no 'N of M path(s) checked' line, so its coverage is unknown. Refusing."
            exit 1
          fi
          checked=${summary% *}
          total=${summary#* }
          # Accounted for = read + the skips the script itself NAMES with a reason
          # on its ">>   skipped: N reason, N reason" line. Parsed, never
          # re-derived here. "deleted" is kept apart because in_scope already
          # excludes deletions, so counting it would let one deletion cover for
          # one unread changed path.
          skipped=0
          deleted=0
          rest=$(printf '%s\n' "$out" | sed -n 's/^>>   skipped: //p' | head -n 1)
          while [ -n "$rest" ]; do
            part=${rest%%, *}
            if [ "$part" = "$rest" ]; then rest=""; else rest=${rest#*, }; fi
            n=${part%% *}
            reason=${part#* }
            case "$n" in
              ''|*[!0-9]*) echo "!! secret scan printed an unparseable skip entry, so its coverage is unknown. Refusing."; exit 1 ;;
            esac
            if [ "$reason" = "deleted" ]; then
              deleted=$((deleted + n))
            else
              skipped=$((skipped + n))
            fi
          done
          # Coverage must match EXACTLY. Fewer is a path neither read nor named;
          # more is an impossible count, so the summary cannot be trusted either.
          accounted=$((checked + skipped))
          if [ "$accounted" -lt "$in_scope" ]; then
            echo "!! secret scan under-count: accounted for ${accounted} (${checked} read, ${skipped} skipped with a reason) of ${in_scope} non-deletion path(s) in scope. A path it neither read nor named is not a pass."
            exit 1
          fi
          if [ "$accounted" -gt "$in_scope" ]; then
            echo "!! secret scan over-count: accounted for ${accounted} (${checked} read, ${skipped} skipped with a reason) but only ${in_scope} non-deletion path(s) are in scope. An impossible count is not a pass."
            exit 1
          fi
          # The script's M, compared like with like. In secret_scan_gate.sh, M is
          # SSG_TOTAL, the line count of ALL_PATHS (lines 129-133, printed at
          # 421-428): in diff mode every status of "git diff --name-only
          # BASE...HEAD" (line 118), in audit mode "git ls-files" (line 111). The
          # scanned list PATHS is the ACMRT subset (line 119), or ALL_PATHS itself
          # in audit (line 112). It names the difference "deleted": total minus
          # len(paths) at lines 422-424, or all of M on the no-paths branch at
          # lines 135-141. ACMRT is in_scope here, so the exact relation is
          #   M == in_scope + deleted
          # where deleted is that named skip, 0 when absent and always 0 in audit.
          if [ "$total" -ne $((in_scope + deleted)) ]; then
            echo "!! secret scan M mismatch: the script says ${total} path(s) in scope, but this step counts ${in_scope} non-deletion plus ${deleted} deleted = $((in_scope + deleted)). The script and the step disagree on the diff."
            exit 1
          fi
          echo ">> secret scan step: ${checked} read plus ${skipped} named skip(s) = ${accounted} accounted for, of ${in_scope} non-deletion path(s) in scope; M ${total} = ${in_scope} + ${deleted} deleted."

      - name: Shell gate
        if: inputs.tier == 'a' || inputs.tier == 'b'
        # shellcheck is preinstalled on the ubuntu runner images.
        run: |
          set -euo pipefail
          if [ "${{ steps.base.outputs.mode }}" = "audit" ]; then
            bash .ci-workflows/scripts/shell_gate.sh --audit
          else
            bash .ci-workflows/scripts/shell_gate.sh --base "${{ steps.base.outputs.ref }}"
          fi

      - name: Settings gate
        if: inputs.tier == 'a'
        # Resolves every script path settings.json references and asserts it exists
        # and is executable. Rewrites the "$HOME"/.claude/ prefix to the repo root,
        # because CI has no ~/.claude and every hook would otherwise read as missing.
        run: bash .ci-workflows/scripts/settings_gate.sh

      - name: Hook smoke
        if: inputs.tier == 'a'
        # Only runs hooks that advertise a --dry-run flag. A hook is arbitrary code
        # with side effects (one commits and pushes), so anything without a declared
        # no-op mode is reported as skipped rather than executed.
        run: bash .ci-workflows/scripts/hook_smoke.sh

      - name: Frontmatter gate
        if: inputs.tier == 'a'
        # A skill with no description never triggers, and never errors either. It
        # looks installed and does nothing.
        run: bash .ci-workflows/scripts/frontmatter_gate.sh

      - name: Set up Node
        if: inputs.tier == 'b' && inputs.build_cmd != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build
        if: inputs.tier == 'b' && inputs.build_cmd != ''
        # The point is to fail on the pull request rather than at deploy time.
        # Several of these repos deploy through Vercel, which builds anyway; the
        # gap this closes is that a broken build was only discovered after merge.
        run: ${{ inputs.build_cmd }}

      - name: Check out the house-style linter
        if: inputs.house_style
        uses: actions/checkout@v5
        with:
          repository: GTMify/claude-house-style
          path: .house-style
          token: ${{ secrets.house_style_token }}

      - name: House-style gate
        if: inputs.house_style
        run: |
          set -euo pipefail
          if [ "${{ steps.base.outputs.mode }}" = "audit" ]; then
            files="$(git ls-files -- '*.md')"
          else
            files="$(git diff --name-only --diff-filter=AM "${{ steps.base.outputs.ref }}...HEAD" -- '*.md')"
          fi
          if [ -z "$files" ]; then
            echo ">> house style: no markdown in scope."
            exit 0
          fi
          failures=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            rc=0
            python3 .house-style/lint/housestyle.py --file "$f" --persona gtmify || rc=$?
            [ "$rc" -ne 0 ] && failures=$((failures + 1))
          done <<< "$files"
          if [ "$failures" -ne 0 ]; then
            echo "!! house style FAILED on ${failures} file(s)."
            exit 1
          fi
          echo ">> house style passed."
